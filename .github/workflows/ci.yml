name: CI

on:
  pull_request:
    # `feat/**` too: an effort built with large-feature-branch-workflow merges
    # each slice into its integration branch `feat/<slug>`, and those slices
    # are merged without waiting for a human. Without this they merged with no
    # CI at all — no tests, no artifact check.
    branches: [develop, main, 'feat/**']
  # On `develop` as well, and the reason is the caches rather than the tests.
  # A cache written by a pull request is scoped to `refs/pull/<N>/merge` and
  # **no other branch can read it** — a pull request reads its base branch's
  # caches and the default branch's, never another pull request's. With CI on
  # `pull_request` alone, nothing is ever written under `refs/heads/develop`
  # and every run starts cold.
  #
  # Measured in nxgt-data on 2026-09-20, where this was learned: 173 cache
  # entries, seven separate copies of mongod — one per pull request — and the
  # only entry on `refs/heads/develop` was `bun-`. The version pull request
  # failed twice in a row under that load, on different tests each time, which
  # is load and not a regression.
  #
  # This repository caches Bun only. The PostgreSQL service, the mongod cache
  # and the Redis cache of the nxgt-janus copy are not here: they call
  # `packages/janus-mongo` and `packages/janus-redis`, which this repository
  # does not have, and a step that cannot find its script fails the run.
  push:
    branches: [develop]

jobs:
  ci:
    name: CI
    # GitHub-hosted. The repository is public, so these minutes are free.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/develop` needs the base branch.
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint code
        run: biome ci
      # A changeset naming a private package is consumed by `changeset
      # version` and published by nothing: the release stays in version mode.
      # A typo in a package name is the same release that never happens.
      # Checked on every run, and early — it takes milliseconds. The release
      # branch has no changesets left, so it passes there.
      - name: Changesets name published packages
        run: bun run changeset:private
      # Build FIRST. Every package's `exports` points at `./dist/*`, so on a
      # clean checkout a package that imports a sibling resolves it to nothing
      # and typecheck reports phantom TS2307s. A developer's tree always has a
      # stale `dist/` lying around, which hides this locally — it only ever
      # shows up in CI. `bun run --filter` builds in dependency order, so
      # building from nothing works. The root postinstall, which builds for
      # the editor, skips itself when CI is set: this step is the build.
      - name: Build packages
        run: bun run build
      - name: Type checking
        run: bun run typecheck
      # Per package, then the scripts' own specs.
      - name: Run tests
        run: bun run test
      # The build exits 0 on packages that throw the instant they are imported —
      # it happened three times in nxgt-core. This packs them, installs them as a consumer
      # does and imports every declared subpath.
      - name: Verify the built artifacts load
        run: bun run verify:artifacts
      # examples/starter is the READMEs followed in an empty Maizzle project:
      # it must build, render and serve an e-mail in two languages. It reaches
      # the packages of this commit through workspace links to their dist/,
      # built above; its templates and send.ts were type-checked above too,
      # after a build that wrote generated/mail.ts, which git ignores.
      - name: Build the starter
        working-directory: examples/starter
        run: bun run build
      # send.ts throws unless every e-mail renders in every locale, filled
      # and escaped; it prints each subject.
      - name: Render the starter's e-mails in both locales
        working-directory: examples/starter
        run: bun run send
      # /__maizzle/templates is the list Maizzle's dev UI shows, as
      # mail-i18n's build spec reads it.
      - name: Serve the starter in both locales
        working-directory: examples/starter
        run: |
          ./node_modules/.bin/maizzle serve --port 3999 > /dev/null 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          list=''
          for attempt in $(seq 1 60); do
            kill -0 $server 2>/dev/null || { echo "maizzle serve exited"; exit 1; }
            list=$(curl -sf http://localhost:3999/__maizzle/templates) && break
            sleep 1
          done
          [ -n "$list" ] || { echo "maizzle serve never answered"; exit 1; }
          for email in en/verify-email fr/verify-email en/sign-in-code fr/sign-in-code; do
            grep -q "\"/.maizzle/i18n/$email\"" <<< "$list" \
              || { echo "maizzle serve does not list $email"; exit 1; }
          done
          curl -sf http://localhost:3999/__maizzle/render/.maizzle/i18n/fr/verify-email \
            | grep -q 'Bonjour {{ name }}' \
            || { echo "maizzle serve does not render fr/verify-email in French"; exit 1; }
          echo "maizzle serve lists every e-mail in en and fr, and renders one"
      # A change to a package without a changeset is a change that never
      # reaches a consumer: the release workflow has nothing to version.
      #
      # Except on the release branch itself. "Version packages" is the PR that
      # *consumes* the changesets: it rewrites every version, deletes the
      # `.changeset/*.md` that justified them, and so trips this check on its
      # own output. Requiring a changeset there would mean requiring one for
      # the act of releasing.
      #
      # And only on a pull request. On a push to `develop` the check compares
      # `develop` with `origin/develop`, which is an empty diff: measured on
      # changesets 3.0.3 it exits 0, so it cannot fail there — but it cannot
      # catch anything either, and a step that can only pass is one a reader
      # has to work out.
      - name: Changeset present
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'changeset-release/develop'
        run: bun run changeset:status
